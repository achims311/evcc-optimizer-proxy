name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    strategy:
      matrix:
        include:
          - arch: amd64
            build_arch: linux/amd64
          - arch: aarch64
            build_arch: linux/arm64
          - arch: armhf
            build_arch: linux/arm/v6
          - arch: armv7
            build_arch: linux/arm/v7
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    
    - name: Log in to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and Push
      uses: docker/build-push-action@v6
      with:
        context: evcc-optimizer-proxy/
        file: evcc-optimizer-proxy/Dockerfile
        platforms: ${{ matrix.build_arch }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ghcr.io/${{ github.repository_owner }}/evcc-optimizer-proxy-${{ matrix.arch }}:latest
          ghcr.io/${{ github.repository_owner }}/evcc-optimizer-proxy-${{ matrix.arch }}:${{ github.ref_name }}
