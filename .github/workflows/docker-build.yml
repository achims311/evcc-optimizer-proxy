name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    strategy:
      matrix:
        include:
          - arch: amd64
            build_arch: linux/amd64
          - arch: aarch64
            build_arch: linux/arm64
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64,arm
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    
    - name: Log in to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Determine version tag
      id: version
      run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
    
    - name: Build and Push
      uses: docker/build-push-action@v6
      with:
        context: evcc-optimizer-proxy/
        file: evcc-optimizer-proxy/Dockerfile
        platforms: ${{ matrix.build_arch }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ghcr.io/${{ github.repository_owner }}/evcc-optimizer-proxy-${{ matrix.arch }}:latest
          ghcr.io/${{ github.repository_owner }}/evcc-optimizer-proxy-${{ matrix.arch }}:${{ steps.version.outputs.tag }}
